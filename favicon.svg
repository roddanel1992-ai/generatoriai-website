    <!-- Main lightning bolt shape -->
    <path d="M 16 6 L 12 16 L 16 16 L 14 26 L 20 16 L 16 16 Z" fill="url(#grad1)" stroke="none"/>
    
    <!-- Inner highlight for depth -->
    <path d="M 16 8 L 13 16 L 16 16 L 15 22 L 18 16 L 16 16 Z" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Sparkle effect -->
