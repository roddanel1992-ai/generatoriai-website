<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e42a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b74e91;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#312450" stroke="url(#grad1)" stroke-width="1.5"/>
  
  <!-- Lightning bolt - modern electrical symbol -->
